[package]
name = "forma-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Axum middleware for Forma SSR: page rendering, asset serving, CSP, service worker"
readme = "README.md"
# Verified by CI (`msrv` job): `cargo +1.85 check -p forma-server --all-targets`.
# This is NOT forma-ir's 1.71 — rust-embed 8 pulls sha2 0.11, whose 0.11.0
# declares 1.85 (0.11.1 declares 1.88; the job locks with the MSRV-aware
# resolver, which holds 0.11.0). The manifest used to claim 1.70, which no
# version of this crate has ever been able to build on.
rust-version = "1.85"
documentation = "https://docs.rs/forma-server"
keywords = ["ssr", "axum", "web-framework", "islands", "forma"]
categories = ["web-programming::http-server"]

[dependencies]
forma-ir = { version = "=3.0.0-beta.1", path = "../forma-ir" }
axum = "0.8"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
base64 = "0.22"
ring = "0.17"
tracing.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
# Fixture encoders and the stand-in panicking component, for the server's own
# tests only (dev-dependency features never reach a consumer's build).
forma-ir = { version = "=3.0.0-beta.1", path = "../forma-ir", features = ["test-helpers", "__fault-injection"] }

[lints]
workspace = true
