[package]
name = "forma-ir-derive"
version = "3.0.0-rc.1"
edition = "2021"
rust-version = "1.71"
license = "MIT"
description = "PageProps derive for Forma declared data schemas and checked encoding"
repository = "https://github.com/getforma-dev/forma"
homepage = "https://getforma.dev"
readme = "README.md"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full"] }
