[package]
name = "forma-ir"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Forma Module IR: binary format, parser, and server-side HTML walker"
readme = "README.md"
# Verified by CI (`msrv` job): `cargo +1.71 check -p forma-ir --all-targets`.
rust-version = "1.71"
documentation = "https://docs.rs/forma-ir"
keywords = ["ssr", "binary-ir", "web-framework", "forma"]
categories = ["web-programming"]

[dependencies]
serde_json.workspace = true
tracing = { workspace = true, optional = true }

[features]
default = ["tracing", "dump"]
dump = []
# Byte-exact FMIR encoders for building test fixtures. Off by default so a
# consumer's release build does not carry them; forma-server's tests and this
# crate's own test targets turn it on.
test-helpers = []
# Shared libFuzzer/stable replay adapter, never enabled by ordinary consumers.
__fuzzing = ["dump"]
# INTERNAL; never for a build that ships. Compiles in `fault_injection`, the
# stand-in component that panics (SR44's tests of `walk_to_html_counted`).
# Enabled only by this crate's and forma-server's own dev-dependencies, and
# never by `test-helpers`, so no 0.2.1 user can have it on; the `__` name puts
# it outside the semver promise.
# Verified by: crates/forma-ir/tests/feature_isolation.rs > "test_helpers_alone_does_not_compile_the_fault_trigger_in"
__fault-injection = []

[lib]
crate-type = ["rlib"]

# Self dev-dependency: the only way to enable a feature for this crate's own
# integration tests and examples without also enabling it for consumers.
[dev-dependencies]
forma-ir = { path = ".", features = ["test-helpers", "__fault-injection", "__fuzzing"] }

[lints]
workspace = true
