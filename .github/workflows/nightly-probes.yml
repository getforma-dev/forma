name: Nightly probes

# Core's mutation-probe corpus (packages/core/probes/corpus.json), applied and
# run in full: each probe edits the source, the whole vitest suite runs, the
# edit is reverted. It runs the suite once per probe, so it is half an hour
# rather than seconds, and does not belong on a PR. CI's `check` job runs the
# cheap half that does: every probe's anchor still applies.
#
# Its own workflow since FORMA-179: as a job in ci.yml it showed as "skipped" on
# every PR and push, the one permanently skipped check. A schedule or a
# dispatch are its only triggers, so no PR or push lists it:
#   gh workflow run nightly-probes.yml --ref <branch>
# Came from formajs's .github at the repository merge (FORMA-113), with its
# paths moved to packages/core.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# A dispatch on the same ref supersedes a run still going; a scheduled run is on
# main and a dispatch is usually on a branch, so the two rarely share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expressions:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      # Independent numerical floor + real removed-registration mutation.
      # Aggregate mutation kills elsewhere cannot satisfy this job.
      - run: node packages/core/scripts/qualify-expression-mutation.mjs
      - run: npm run build -w packages/core
      - run: npx playwright install --with-deps chromium
      - run: node packages/core/e2e/hostile-widgets/run.mjs
      - run: node packages/core/e2e/hostile-widgets/qualify-guard.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: expression-campaign-results
          path: packages/core/fuzz/expressions/out/*.json
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hostile-widget-campaign-results
          path: packages/core/e2e/hostile-widgets/out/*.json
          retention-days: 30
  # Nightly mutation run with a detection floor. A survivor is a property
  # nothing in the suite defends, so the floor is a ratchet: it may go up.
  probes:
    # The job only reads this repository (FORMA-010). The cache and artifact
    # steps authenticate with the runner's own service token, which
    # `permissions:` does not govern.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # MEASURED with strict serial assertion evidence (FORMA-197, run
    # 38971432837): 96 probes plus clean/restored baselines took 42m44s;
    # mutation subprocesses averaged 24.2s. The same mix projects ~106 min
    # for all 252, not a measured full-run duration. Allow 150 min including
    # setup/recovery baselines; retain each child's 15 min bound and all floors.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/run-probes.mjs --floor=85 --expr-floor=85
        working-directory: packages/core
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-probe-results
          path: |
            packages/core/probes/results.json
            packages/core/probes/expression-floor.json
            packages/core/probes/runs/
          retention-days: 30
