name: Post-final packed RC soak v2
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rc-burn-in-v3.0.0-rc.5
  cancel-in-progress: false
jobs:
  burn-in:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: donor
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rc
          ref: 12320f4340d87cbb96575b5bb3b7eab42121d477
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: rc/.node-version
          package-manager-cache: false
      - name: Check separate donor and immutable RC identities before Python
        run: |
          mkdir "$RUNNER_TEMP/soak-orchestration"
          node donor/scripts/release-soak-context-v2.mjs check "$GITHUB_WORKSPACE/rc" "$RUNNER_TEMP/soak-orchestration/before.json"
          cd rc
          python3 scripts/release-owned-linux.test.py
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: '1.93.1'
      - name: Install immutable RC tools and pinned sanitizer harness
        working-directory: rc
        run: |
          bash scripts/install-deps.sh
          npm audit signatures
          rustup toolchain install nightly-2026-10-01 --profile minimal
          cargo +nightly-2026-10-01 install cargo-fuzz --version 0.13.2 --locked
          node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - name: Continuous packed RC workloads
        working-directory: rc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node ../donor/scripts/release-soak-context-v2.mjs check "$GITHUB_WORKSPACE/rc" "$RUNNER_TEMP/soak-orchestration/pre-worker.json"
          python3 scripts/release-owned-linux.py "$RUNNER_TEMP/burn-in-owned" 9900 -- node ../donor/scripts/release-soak-worker-v2.mjs worker "$GITHUB_WORKSPACE/rc" "$RUNNER_TEMP/burn-in-evidence" "$RUNNER_TEMP/burn-in-work"
      - name: Authenticate results and cleanup before recording success
        id: result
        run: node donor/scripts/release-soak-worker-v2.mjs finalize "$GITHUB_WORKSPACE/rc" "$RUNNER_TEMP/burn-in-evidence" "$RUNNER_TEMP/burn-in-owned" "$RUNNER_TEMP/burn-in-work"
      - name: Retain source status after success or failure
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/soak-orchestration"
          node donor/scripts/release-soak-context-v2.mjs status "$GITHUB_WORKSPACE/rc" "$RUNNER_TEMP/soak-orchestration/after.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rc-burn-in
          path: ${{ runner.temp }}/burn-in-evidence/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rc-burn-in-ownership
          path: ${{ runner.temp }}/burn-in-owned/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rc-soak-orchestration
          path: ${{ runner.temp }}/soak-orchestration/
          if-no-files-found: error
          retention-days: 90
      - name: Record the exact evidence manifest for completion
        env:
          MANIFEST_SHA256: ${{ steps.result.outputs.manifest-sha256 }}
        run: |
          printf 'RC burn-in evidence SHA-256: %s\n' "$MANIFEST_SHA256" >> "$GITHUB_STEP_SUMMARY"
