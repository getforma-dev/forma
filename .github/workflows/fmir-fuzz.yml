name: FMIR nightly fuzz
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fmir-fuzz-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [parse_raw, parse_body, parse_mutated, walk]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned nightly and cargo-fuzz
        working-directory: fuzz
        run: |
          rustup show active-toolchain
          cargo install cargo-fuzz --version 0.13.2 --locked
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
          key: fmir-nightly-2026-10-01
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fmir-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fmir-corpus-${{ matrix.target }}-
      - name: Seed known modules, refusals and regressions
        run: python3 fuzz/seed-corpus.py
      - name: Fuzz under AddressSanitizer for twenty minutes
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} --sanitizer address -- -max_total_time=1200 -timeout=10 -rss_limit_mb=2048 -max_len=65536
      - name: Preserve any finding for minimized stable replay
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fmir-findings-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
