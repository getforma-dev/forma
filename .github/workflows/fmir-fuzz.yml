name: FMIR nightly fuzz
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fmir-fuzz-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [parse_raw, parse_body, parse_mutated, walk]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned nightly and cargo-fuzz
        working-directory: fuzz
        run: |
          rustup show active-toolchain
          cargo install cargo-fuzz --version 0.13.2 --locked
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          key: fmir-nightly-2026-10-01
      # cargo-fuzz 0.13.2 has no --locked flag. Fetch the committed graph first,
      # then forbid network resolution and check that its lock stays byte-identical.
      # AddressSanitizer uses the pinned toolchain's std; --build-std is not enabled.
      - name: Fetch only the committed fuzz dependency graph
        id: dependencies
        working-directory: fuzz
        run: |
          sha256sum Cargo.lock > "$RUNNER_TEMP/fmir-cargo-lock.sha256"
          cargo fetch --locked
          sha256sum --check "$RUNNER_TEMP/fmir-cargo-lock.sha256"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fmir-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fmir-corpus-${{ matrix.target }}-
      - name: Seed known modules, refusals and regressions
        run: python3 fuzz/seed-corpus.py
      - name: Fuzz under AddressSanitizer for twenty minutes
        working-directory: fuzz
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo fuzz run ${{ matrix.target }} --sanitizer address -- -max_total_time=1200 -timeout=10 -rss_limit_mb=2048 -max_len=65536
      - name: Verify the committed fuzz lockfile did not change
        if: always() && steps.dependencies.outcome == 'success'
        working-directory: fuzz
        run: sha256sum --check "$RUNNER_TEMP/fmir-cargo-lock.sha256"
      - name: Preserve any finding for minimized stable replay
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fmir-findings-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
