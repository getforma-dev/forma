name: Release

# SR13/SR43: branches, pull requests and dispatch cannot reach the publish jobs.
on:
  push:
    tags: ['v*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

jobs:
  check:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      started-at: ${{ steps.ci.outputs.started-at }}
      ci-run: ${{ steps.ci.outputs.ci-run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Require successful exact-commit main CI, including R17 and probes
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-ci.mjs

  pack:
    needs: check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      record-sha256: ${{ steps.record.outputs.record-sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.93.1'
      - name: Check all seven manifests against the tag
        run: node scripts/release-set.mjs check "$GITHUB_REF_NAME"
      - name: Install the committed graph with scripts off
        run: bash scripts/install-deps.sh
      - name: Build without the publish credential
        run: npm run build
      - name: Pack DS11, staging only the template's internal package checksums
        run: node scripts/release-set.mjs pack "$RUNNER_TEMP/release"
      - name: Record every DS11 file
        id: record
        run: |
          RECORD_SHA256=$(bash scripts/release-artifacts.sh record "$RUNNER_TEMP/release")
          echo "record-sha256=$RECORD_SHA256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-packed
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          overwrite: true

  verify:
    needs: [check, pack]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      report-sha256: ${{ steps.record.outputs.report-sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.93.1'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-packed
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Verify every DS11 byte against pack's output
        env:
          RECORD_SHA256: ${{ needs.pack.outputs.record-sha256 }}
        run: bash scripts/release-artifacts.sh verify "$RUNNER_TEMP/release" "$RECORD_SHA256"
      - name: The advisory gate sees the recorded Cargo lock
        run: bash scripts/release-artifacts.sh match "$RUNNER_TEMP/release" Cargo.lock
      - name: Install locked test tools with scripts off
        run: bash scripts/install-deps.sh
      - name: Fail closed on advisories in the recorded dependency graph
        run: bash scripts/check-advisories.sh
      - name: Verify registry signatures and provenance of locked dependencies
        run: npm audit signatures
      - name: Install the locked Chromium runner
        timeout-minutes: 5
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: P17 packed corpus and both templates
        run: |
          mkdir "$RUNNER_TEMP/p17"
          node scripts/verify-release-set.mjs "$RUNNER_TEMP/release" "$RUNNER_TEMP/p17/p17.json"
      - name: Record P17's evidence
        id: record
        run: |
          REPORT_SHA256=$(bash scripts/release-artifacts.sh record "$RUNNER_TEMP/p17")
          echo "report-sha256=$REPORT_SHA256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-p17
          path: ${{ runner.temp }}/p17/
          if-no-files-found: error
          overwrite: true

  # Minimal credential job: no dependency installation, code execution or cache.
  publish-crates:
    needs: [check, pack, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    environment: crates-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.93.1'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-packed
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Verify every DS11 byte against pack's output
        env:
          RECORD_SHA256: ${{ needs.pack.outputs.record-sha256 }}
        run: bash scripts/release-artifacts.sh verify "$RUNNER_TEMP/release" "$RECORD_SHA256"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        id: auth
      - name: Repack, compare, then publish missing crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: node scripts/release-publish.mjs "$RUNNER_TEMP/release" crates

  # Minimal credential job: no dependency installation, code execution or cache.
  publish-npm:
    needs: [check, pack, verify, publish-crates]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    environment: npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-packed
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Verify every DS11 byte against pack's output
        env:
          RECORD_SHA256: ${{ needs.pack.outputs.record-sha256 }}
        run: bash scripts/release-artifacts.sh verify "$RUNNER_TEMP/release" "$RECORD_SHA256"
      - name: Publish only missing verified tarballs, prereleases on next
        run: node scripts/release-publish.mjs "$RUNNER_TEMP/release" npm

  record:
    needs: [check, pack, verify, publish-crates, publish-npm]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-packed
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Verify every DS11 byte against pack's output
        env:
          RECORD_SHA256: ${{ needs.pack.outputs.record-sha256 }}
        run: bash scripts/release-artifacts.sh verify "$RUNNER_TEMP/release" "$RECORD_SHA256"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-p17
          path: ${{ runner.temp }}/p17
          digest-mismatch: error
      - name: Verify P17 evidence
        env:
          RECORD_SHA256: ${{ needs.verify.outputs.report-sha256 }}
        run: bash scripts/release-artifacts.sh verify "$RUNNER_TEMP/p17" "$RECORD_SHA256"
      - name: Write DS12, the compatibility record and elapsed time
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STARTED_AT: ${{ needs.check.outputs.started-at }}
          CI_RUN: ${{ needs.check.outputs.ci-run }}
        run: node scripts/release-record.mjs "$RUNNER_TEMP/release" "$RUNNER_TEMP/p17/p17.json"
