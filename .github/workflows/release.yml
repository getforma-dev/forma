name: Release

# SR13/SR43: branches, pull requests and dispatch cannot reach the publish jobs.
on:
  push:
    tags: ['v*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

jobs:
  check:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      started-at: ${{ steps.ci.outputs.started-at }}
      ci-run: ${{ steps.ci.outputs.ci-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Require successful exact-commit main CI, including R17 and probes
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-ci.mjs
      - name: Validate published support history and next-major spacing
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-support.mjs
      - name: Require the RC audit or final burn-in evidence before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-qualification.mjs

  # The existing reusable suite runs Chromium, Firefox and WebKit on this tag.
  engines:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-engines.yml

  pack:
    needs: check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      record-sha256: ${{ steps.record.outputs.record-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: '1.93.1'
      - name: Check all coordinated manifests against the tag
        run: node scripts/release-set.mjs check "$GITHUB_REF_NAME"
      - name: Install the committed graph with scripts off
        run: bash scripts/install-deps.sh
      - name: Build without the publish credential
        run: npm run build
      - name: Pack DS11, staging only the template's internal package checksums
        run: node scripts/release-set.mjs pack "$RUNNER_TEMP/release"
      - name: Record every DS11 file
        id: record
        run: |
          RECORD_SHA256=$(bash scripts/release-artifacts.sh record "$RUNNER_TEMP/release")
          echo "record-sha256=$RECORD_SHA256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packed
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          overwrite: true

  verify:
    # P17 consumes the packed set; both publishers separately require engines.
    needs: [check, pack]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      report-sha256: ${{ steps.record.outputs.report-sha256 }}
      p17-run-attempt: ${{ steps.record.outputs.p17-run-attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: '1.93.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packed
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Verify every DS11 byte against pack's output
        env:
          RECORD_SHA256: ${{ needs.pack.outputs.record-sha256 }}
        run: bash scripts/release-artifacts.sh verify "$RUNNER_TEMP/release" "$RECORD_SHA256"
      - name: The advisory gate sees the recorded Cargo lock
        run: bash scripts/release-artifacts.sh match "$RUNNER_TEMP/release" Cargo.lock
      - name: Install locked test tools with scripts off
        run: bash scripts/install-deps.sh
      - name: Install the pinned advisory checker with its own locked graph
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Fail closed on advisories in the recorded dependency graph
        run: bash scripts/check-advisories.sh
      - name: Verify registry signatures and provenance of locked dependencies
        run: npm audit signatures
      - name: Install the locked three-engine runners
        timeout-minutes: 5
        run: |
          # Keep the same signed Ubuntu suites/packages. The Azure mirror stalled
          # the retained b071500c attempt before any P17 test could execute.
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [[ -f "$apt_source" ]]; then
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - name: P17 packed corpus and both templates
        timeout-minutes: 45
        run: |
          mkdir "$RUNNER_TEMP/p17"
          node scripts/verify-release-set.mjs "$RUNNER_TEMP/release" "$RUNNER_TEMP/p17/p17.json"
      - name: Record P17's evidence
        id: record
        run: |
          REPORT_SHA256=$(node scripts/release-evidence.mjs record "$RUNNER_TEMP/p17")
          echo "report-sha256=$REPORT_SHA256" >> "$GITHUB_OUTPUT"
          echo "p17-run-attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Keep actual failed P17 diagnostics; verify still fails and blocks publishing.
        if: always()
        with:
          name: release-p17
          path: ${{ runner.temp }}/p17/
          if-no-files-found: error
          overwrite: true

  # Minimal credential job: no dependency installation, dependency code or cache.
  publish-crates:
    needs: [check, pack, engines, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    environment: crates-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: '1.93.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packed
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Verify every DS11 byte against pack's output
        env:
          RECORD_SHA256: ${{ needs.pack.outputs.record-sha256 }}
        run: bash scripts/release-artifacts.sh verify "$RUNNER_TEMP/release" "$RECORD_SHA256"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Repack, compare, then publish missing crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: node scripts/release-publish.mjs "$RUNNER_TEMP/release" crates

  # Minimal credential job: no dependency installation, dependency code or cache.
  publish-npm:
    needs: [check, pack, engines, verify, publish-crates]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    environment: npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packed
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Verify every DS11 byte against pack's output
        env:
          RECORD_SHA256: ${{ needs.pack.outputs.record-sha256 }}
        run: bash scripts/release-artifacts.sh verify "$RUNNER_TEMP/release" "$RECORD_SHA256"
      - name: Publish only missing verified tarballs, prereleases on next
        env:
          # One first-package enrollment; the script confines this to the router child.
          NPM_ROUTER_BOOTSTRAP_TOKEN: ${{ github.ref == 'refs/tags/v3.2.0-rc.1' && secrets.NPM_ROUTER_BOOTSTRAP_TOKEN || '' }}
        run: node scripts/release-publish.mjs "$RUNNER_TEMP/release" npm

  record:
    needs: [check, pack, engines, verify, publish-crates, publish-npm]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packed
          path: ${{ runner.temp }}/release
          digest-mismatch: error
      - name: Verify every DS11 byte against pack's output
        env:
          RECORD_SHA256: ${{ needs.pack.outputs.record-sha256 }}
        run: bash scripts/release-artifacts.sh verify "$RUNNER_TEMP/release" "$RECORD_SHA256"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-p17
          path: ${{ runner.temp }}/p17
          digest-mismatch: error
      - name: Verify P17 evidence
        env:
          RECORD_SHA256: ${{ needs.verify.outputs.report-sha256 }}
        run: node scripts/release-evidence.mjs verify "$RUNNER_TEMP/p17" "$RECORD_SHA256"
      - name: Write DS12, the compatibility record and elapsed time
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STARTED_AT: ${{ needs.check.outputs.started-at }}
          CI_RUN: ${{ needs.check.outputs.ci-run }}
          P17_MANIFEST_SHA256: ${{ needs.verify.outputs.report-sha256 }}
          P17_RUN_ATTEMPT: ${{ needs.verify.outputs.p17-run-attempt }}
        run: node scripts/release-record.mjs "$RUNNER_TEMP/release" "$RUNNER_TEMP/p17/p17.json"
