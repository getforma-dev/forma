name: Forma R17 scheduler functional pilot

# Development-only donor. NEVER MERGE. One complete functional execution of
# frozen prototype 429b7f315c2c4e4382b566eb5e1f8e23617ec4c5, not an N7 sample.
# Ordinary runner/setup/cache/retry profile is preserved. No publish, secrets,
# product prewarming, threshold changes or automatic rerun. Retain all outcomes.
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Frozen prototype 429b7f315c2c4e4382b566eb5e1f8e23617ec4c5 (exact commit required)
        required: true
        type: string

# Serialize accidental second dispatches without cancelling an active campaign.
concurrency:
  group: forma-301-r17-scheduler-pilot
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  check:
    name: Full scheduler prototype (functional pilot)
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      WORKFLOW_COMMIT: ${{ github.workflow_sha }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # MEASURED locally at the rehearsal (FORMA-113; see the ticket's log for
    # the number); the Rust half alone measured 2.1m in forma's CI with its
    # cache, the e2e lanes 2m in forma-tools'. 25 bounds a cold cache on a slow
    # runner; the two browser install steps are bounded on their own.
    timeout-minutes: 25
    steps:
      - name: Validate immutable source and record runner
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/scheduler-pilot"
          mkdir -p "$evidence"
          python3 - <<'PROFILE'
          import json, os, pathlib
          keys = ['SOURCE_COMMIT', 'WORKFLOW_COMMIT', 'GITHUB_SHA',
                  'GITHUB_REPOSITORY', 'GITHUB_WORKFLOW_REF', 'GITHUB_REF',
                  'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'RUNNER_NAME',
                  'RUNNER_OS', 'RUNNER_ARCH', 'ImageOS', 'ImageVersion']
          record = {key: os.environ.get(key) for key in keys}
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'scheduler-pilot' / 'identity.json'
          target.write_text(json.dumps(record, indent=2) + '\n')
          PROFILE
          uname -a > "$evidence/uname.txt"
          cat /etc/os-release > "$evidence/os-release.txt"
          lscpu --json > "$evidence/lscpu.json"
          cat /proc/meminfo > "$evidence/meminfo.txt"
          taskset -pc $$ > "$evidence/cpu-affinity.txt"
          nproc > "$evidence/available-processors.txt"
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::source_commit must be an exact lowercase 40-hex commit'
            exit 64
          fi
          if [[ "$SOURCE_COMMIT" != 429b7f315c2c4e4382b566eb5e1f8e23617ec4c5 ]]; then
            echo '::error::This functional pilot admits only the frozen reviewed prototype source'
            exit 64
          fi
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo '::error::This functional pilot does not permit automatic reruns'
            exit 64
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
          fetch-depth: 2
      - name: Assert actual checkout identity
        shell: bash
        run: |
          actual=$(git rev-parse HEAD)
          printf '%s\n' "$actual" > "$RUNNER_TEMP/scheduler-pilot/checkout-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/scheduler-pilot/checkout-tree.txt"
          git rev-parse HEAD^ > "$RUNNER_TEMP/scheduler-pilot/checkout-parent.txt"
          test "$actual" = "$SOURCE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = 4728f9e8ba23b566d8c609ab20e83455866a3cfd
          test "$(git rev-parse HEAD^)" = 0cf47cdd6b487543f488f60695f74553282bbe9c
          test -z "$(git status --porcelain)"
          python3 - <<'SOURCE'
          import hashlib, json, os, pathlib, subprocess
          expected = sorted(['scripts/check-core-partition.json', 'scripts/check-core-partition.mjs',
            'scripts/check-scheduler-workload.json', 'scripts/check-scheduler-prototype.sh',
            'scripts/check-scheduler-lanes.sh', 'scripts/check-scheduler-pair.mjs',
            'scripts/check-scheduler.test.mjs', 'scripts/check-scheduler-owned.test.mjs'])
          actual = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines()
          assert sorted(actual) == expected, actual
          rows = {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in expected}
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'scheduler-pilot/source-files.json'
          target.write_text(json.dumps(rows, indent=2) + '\n')
          SOURCE
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The crates' workspace and the e2e lanes' own (e2e/Cargo.toml).
          workspaces: |
            .
            e2e
          key: check

      # Chromium in two halves, its system packages from the runner's apt
      # mirror and then the browser from Playwright's CDN, each restored from a
      # cache when it can be and each bounded with one retry (FORMA-179): a
      # slow apt mirror once held formajs's WebKit install past its job's
      # timeout. Both caches are keyed on the resolved Playwright version,
      # which decides the browser build and the package list; the packages'
      # key also names the runner image, whose package versions they must
      # match. The version is read from the lockfile, before `npm ci`.
      - name: Resolve Playwright version and runner image
        id: pw
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      # apt checks each restored archive against the signed package index
      # before it installs it, and downloads again any that differs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-apt
          key: playwright-apt-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install chromium's system packages, retried once
        # Normally seconds (formajs measured 22 MB in 2s); each attempt is cut
        # at 4 minutes, with a bounded lock wait and dpkg recovery between
        # attempts: about 9m45s at worst, including signal escalation.
        timeout-minutes: 11
        env:
          PLAYWRIGHT_VERSION: ${{ steps.pw.outputs.version }}
        run: |
          python3 scripts/playwright-deps-timeout.test.py
          python3 scripts/prefer-ubuntu-archive.test.py
          python3 scripts/prefer-ubuntu-archive.py --runner-environment '${{ runner.environment }}'
          shopt -s nullglob
          mkdir -p ~/.cache/playwright-apt
          cached=(~/.cache/playwright-apt/*.deb)
          echo "${#cached[@]} archives restored from the cache"
          if [ "${#cached[@]}" -gt 0 ]; then sudo cp "${cached[@]}" /var/cache/apt/archives/; fi
          for attempt in 1 2; do
            # Root owns the timeout and apt process group; runner-owned timeout
            # cannot terminate privileged apt children after a stalled mirror.
            if sudo timeout --kill-after=20s 4m env "PATH=$PATH" \
              "npm_config_cache=$RUNNER_TEMP/playwright-root-npm" \
              "$(command -v node)" "$(command -v npx)" --yes --ignore-scripts \
              "playwright@$PLAYWRIGHT_VERSION" install-deps chromium; then
              break
            fi
            if [ "$attempt" = 2 ]; then
              echo "::error::installing chromium's system packages failed twice; see the apt output above"
              exit 1
            fi
            echo "::warning::installing chromium's system packages failed or ran past 4 minutes; retrying once"
            # Recover only after the lock is released. Bound recovery too;
            # never start another apt transaction while the old one owns it.
            if ! sudo timeout --kill-after=5s 60s sh -c '
              while fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1; do sleep 1; done
              dpkg --configure -a
            '; then
              echo "::error::apt lock/recovery did not complete; refusing a competing retry"
              exit 1
            fi
          done
          fresh=(/var/cache/apt/archives/*.deb)
          if [ "${#fresh[@]}" -gt 0 ]; then cp "${fresh[@]}" ~/.cache/playwright-apt/; fi
          echo "${#fresh[@]} archives kept for the cache"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install chromium, retried once
        # A no-op on a cache hit; each attempt is cut at 2 minutes.
        timeout-minutes: 5
        env:
          PLAYWRIGHT_VERSION: ${{ steps.pw.outputs.version }}
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=20s 2m npx --yes "playwright@$PLAYWRIGHT_VERSION" install chromium; then
              exit 0
            fi
            echo "::warning::installing chromium failed or ran past 2 minutes (attempt $attempt of 2)"
          done
          echo "::error::installing chromium failed twice; see the output above"
          exit 1

      - name: Record installed toolchains
        shell: bash
        run: |
          {
            node --version
            npm --version
            rustc --version --verbose
            cargo --version --verbose
          } > "$RUNNER_TEMP/scheduler-pilot/toolchains.txt"

      - name: Refuse serial fallback context
        shell: bash
        run: |
          python3 - <<'CONTEXT'
          import json, os, pathlib, platform
          keys = ['FORMA_SCAFFOLD_E2E', 'FORMA_LIST_KEY_EVIDENCE',
                  'FORMA_LIST_KEY_CORE_BUNDLE', 'CARGO_TARGET_DIR']
          record = {key: os.environ.get(key) for key in keys}
          record['platform'] = platform.system()
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'scheduler-pilot/fallback-context.json'
          target.write_text(json.dumps(record, indent=2) + '\n')
          CONTEXT
          if [[ "$(uname -s)" != Linux || "${FORMA_SCAFFOLD_E2E:-}" = 1 || -n "${FORMA_LIST_KEY_EVIDENCE:-}${FORMA_LIST_KEY_CORE_BUNDLE:-}${CARGO_TARGET_DIR:-}" ]]; then
            echo '::error::The pilot must execute the prototype, not its serial fallback'
            exit 64
          fi

      - name: Complete scheduler prototype
        id: r17
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/scheduler-pilot"
          date --iso-8601=ns > "$evidence/command-start.txt"
          # One development execution: all original workload plus prototype
          # controls remains inside this timer, including npm ci. The raw outer
          # log and both lane logs survive failure. This is not N7 qualification.
          set +e
          /usr/bin/time --format='elapsed_seconds=%e\nuser_seconds=%U\nsystem_seconds=%S' --output="$evidence/command-time.txt" bash scripts/check-scheduler-prototype.sh "$evidence/scheduler" 2>&1 | tee "$evidence/r17.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf 'command_exit=%s\nlog_exit=%s\n' "${statuses[0]}" "${statuses[1]}" > "$evidence/command-status.txt"
          date --iso-8601=ns > "$evidence/command-end.txt"
          if [[ "${statuses[0]}" != 0 ]]; then exit "${statuses[0]}"; fi
          exit "${statuses[1]}"

      - name: Record functional outcome
        if: always()
        shell: bash
        env:
          R17_OUTCOME: ${{ steps.r17.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/scheduler-pilot"
          printf 'r17_step_outcome=%s\n' "$R17_OUTCOME" > "$RUNNER_TEMP/scheduler-pilot/step-outcome.txt"
          python3 - <<'MANIFEST'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'scheduler-pilot'
          rows = []
          for path in sorted(root.rglob('*')):
            assert not path.is_symlink(), path
            if path.is_file() and path.name != 'output-manifest.json':
              body = path.read_bytes()
              rows.append({'path': str(path.relative_to(root)), 'bytes': len(body),
                           'sha256': hashlib.sha256(body).hexdigest()})
          (root / 'output-manifest.json').write_text(json.dumps(rows, indent=2) + '\n')
          MANIFEST

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scheduler-pilot
          path: ${{ runner.temp }}/scheduler-pilot/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            packages/core/playwright-report/
            packages/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: indexed-public-set-chromium
          path: test-results/indexed-chromium/**/indexed-public-set.json
          if-no-files-found: warn
          retention-days: 14

      # R17 owns the blocking corpus run; retain its measured report on success
      # and failure without running a duplicate non-blocking job.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: parity-report
          path: ${{ runner.temp }}/parity/
          if-no-files-found: warn
          retention-days: 14

      # Preserve actual source-campaign results even when a later R17 gate fails.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-campaigns
          path: |
            packages/core/e2e/hostile-widgets/out/*.json
            packages/core/fuzz/expressions/out/*.json
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scheduler-native-proof
          path: test-results/router-native/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
