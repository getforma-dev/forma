name: Primitive text ABBA comparison (NEVER MERGE)
# One diagnostic comparison, not qualification or publication. No automatic retries.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '4'
      FORMA_SSR_PROFILE: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: donor
          fetch-depth: 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 93d3d9370b2b67ceed21c8f80d41566dbe6dca86
          path: baseline
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 03ffd92891924f0421b663bfc42d355c87214d0d
          path: candidate
          fetch-depth: 2
      - name: Refuse retries and bind exact original sources before setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git -C baseline rev-parse HEAD)" = 93d3d9370b2b67ceed21c8f80d41566dbe6dca86
          test "$(git -C candidate rev-parse HEAD)" = 03ffd92891924f0421b663bfc42d355c87214d0d
          test "$(git -C candidate rev-parse HEAD^)" = 93d3d9370b2b67ceed21c8f80d41566dbe6dca86
          test "$(git -C donor rev-parse HEAD^)" = 03ffd92891924f0421b663bfc42d355c87214d0d
          git -C candidate diff --name-only HEAD^ HEAD > evidence/candidate-paths.txt
          printf '%s\n' packages/core/src/dom/__tests__/adoption-text-read.test.ts packages/core/src/dom/adoption.ts | diff - evidence/candidate-paths.txt
          git -C donor diff --name-only HEAD^ HEAD > evidence/donor-paths.txt
          printf '%s\n' .github/workflows/ci.yml scripts/indexed-primitive-comparison.mjs scripts/indexed-primitive-comparison.test.mjs | diff - evidence/donor-paths.txt
          {
            for source in donor baseline candidate; do
              printf '%s\n' "$source"
              git -C "$source" rev-parse HEAD HEAD^{tree}
              git -C "$source" status --short
            done
            uname -a
            lscpu
            printf 'ImageOS=%s\nImageVersion=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          } > evidence/environment.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: donor/.node-version
          cache: npm
          cache-dependency-path: |
            baseline/package-lock.json
            candidate/package-lock.json
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - name: Exact independent scripts-off installs
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline && npm ci --ignore-scripts) 2>&1 | tee evidence/install-A.log
          (cd candidate && npm ci --ignore-scripts) 2>&1 | tee evidence/install-B.log
          { node --version; npm --version; rustc --version; cargo --version; node -p "require('./baseline/node_modules/@playwright/test/package.json').version"; } >> evidence/environment.txt
      - name: Install the shared locked Chromium once
        timeout-minutes: 5
        run: node baseline/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Normal serial builds in both exact source checkouts
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline && npm run build -w packages/core && bash e2e/ssr/build.sh) 2>&1 | tee evidence/build-A.log
          (cd candidate && npm run build -w packages/core && bash e2e/ssr/build.sh) 2>&1 | tee evidence/build-B.log
      - name: Four original timing specs in fixed ABBA order under existing ownership
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python3 baseline/scripts/release-owned-linux.py "$RUNNER_TEMP/indexed-primitive-owned" 570 -- \
            node donor/scripts/indexed-primitive-comparison.mjs \
            "$GITHUB_WORKSPACE/baseline" "$GITHUB_WORKSPACE/candidate" "$GITHUB_WORKSPACE/evidence/comparison"
      - name: Retain every original result and partial slot, with owned cleanup
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: indexed-primitive-abba
          path: |
            evidence/
            ${{ runner.temp }}/indexed-primitive-owned/
            baseline/e2e/ssr/out/site/keyed-indexed/
            baseline/e2e/ssr/out/site/_assets/
            candidate/e2e/ssr/out/site/keyed-indexed/
            candidate/e2e/ssr/out/site/_assets/
          if-no-files-found: error
          retention-days: 30
