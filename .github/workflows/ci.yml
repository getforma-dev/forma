name: Indexed equal-owner diagnostic (NEVER MERGE)
# Temporary donor on an already registered workflow. No qualification or publishing.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: '4'
      FORMA_SSR_E2E_PORT: '3458'
      FORMA_SSR_PROFILE: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Refuse retries and record actual source and host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/indexed-null
          {
            git rev-parse HEAD HEAD^{tree} HEAD^
            git status --short
            uname -a
            lscpu
            printf 'ImageOS=%s\nImageVersion=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          } > test-results/indexed-null/environment.txt
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD^)" = 93d3d9370b2b67ceed21c8f80d41566dbe6dca86
          git diff --exit-code HEAD^ HEAD -- packages crates package-lock.json Cargo.lock e2e/Cargo.lock e2e/ssr/cases e2e/ssr/build.sh e2e/ssr/build-cases.mjs e2e/ssr/serve.mjs e2e/ssr/indexed-timing.ts e2e/ssr/indexed-progress.mjs scripts/release-owned-linux.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: html-context-engines
      - run: npm ci --ignore-scripts
      - name: Retain actual installed toolchain identities
        shell: bash
        run: |
          set -euo pipefail
          { node --version; npm --version; rustc --version; cargo --version; node -p "require('@playwright/test/package.json').version"; } >> test-results/indexed-null/environment.txt
      - name: Install current locked Chromium once
        timeout-minutes: 5
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Build current core and typed production SSR fixture
        shell: bash
        run: |
          set -euo pipefail
          npm run build -w packages/core
          npm run build -w packages/compiler -w packages/build
          bash e2e/ssr/build.sh
      - name: Exactly three serial diagnostic arms under existing Linux ownership
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release-owned-linux.py "$RUNNER_TEMP/indexed-null-owned" 570 -- node node_modules/@playwright/test/cli.js test --config e2e/ssr/indexed-diagnostic.config.ts
      - name: Keep all original observations and cleanup, including incomplete arms
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: indexed-null-diagnostic
          path: |
            test-results/indexed-null/
            ${{ runner.temp }}/indexed-null-owned/
            e2e/ssr/out/site/keyed-indexed/
            e2e/ssr/out/site/_assets/
          if-no-files-found: error
          retention-days: 30
