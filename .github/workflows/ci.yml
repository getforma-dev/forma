name: CI

on:
  push:
    branches: [main]
    # Doc-only pushes to main do not need seven runners. Deliberately NOT
    # applied to `pull_request`: if any of these jobs is a required status
    # check, a skipped workflow leaves the check permanently pending and the
    # PR can never merge. Extend this to pull_request only after confirming
    # branch protection does not require these checks.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]

# One run per ref. A second push to the same branch cancels the first, which is
# the single largest reduction in runner demand available: on 2026-08-06 four
# repos pushed at once and asked for ~44 concurrent jobs against a 20-job
# limit, producing 20-58 minute runner waits that looked exactly like hangs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are pure overhead on an ephemeral runner and bloat
  # the rust-cache payload.
  CARGO_INCREMENTAL: 0
  # crates.io and static.rust-lang.org both returned 5xx during the 2026-08-06
  # Actions incident. Retrying is free; a failed release over a blip is not.
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ksx Studio — the production consumer — is a Windows app, so Windows
        # is a first-class runner here, not an afterthought.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # MEASURED: 2.1m on ubuntu and 6.5m on windows, from the healthy-runner
    # jobs of run #16; 10s warm locally. 20 is ~3x the Windows number, which is
    # the slow leg, and still fails ~2.5x faster than the runner waits that
    # masqueraded as hangs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct keys per OS so the Windows leg never restores a Linux
          # target dir and rebuilds the world.
          key: ${{ matrix.os }}
      - run: cargo fmt --all --check
      # --all-targets so the tests, examples and the linearity gate are linted
      # too; --all-features so the wasm exports and the fixture encoders are
      # not silently excluded from the lint that claims to cover the workspace.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
      - name: Verify WASM build
        run: cargo build --target wasm32-unknown-unknown -p forma-ir --features wasm --no-default-features

  # Run the suite where `usize` is 32 bits, as it is on wasm32 — the target
  # this crate actually ships a build for. Offset arithmetic that cannot wrap
  # on 64-bit can wrap there, and a debug build turns that into a panic, so
  # building for wasm32 is not enough: the tests have to RUN at 32 bits.
  #
  # `needs: test` is a runner-demand fix, not a correctness one. This job
  # rebuilds the whole workspace for a second target and installs gcc-multilib;
  # gating it behind `test` means the cheap tier has released its runners
  # before the expensive tier asks for any. Peak concurrent demand for this
  # workflow drops from 7 jobs to 4.
  test-32bit:
    runs-on: ubuntu-latest
    needs: test
    # MEASURED: 5.3m in CI (run #16, healthy runner). 20 is ~4x.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: i686
      - name: Install 32-bit toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: cargo test --workspace --target i686-unknown-linux-gnu

  # The two crates publish different `rust-version` values and both are
  # load-bearing on crates.io/docs.rs, so both are built at exactly the
  # declared version. Without this the numbers are decoration — the manifest
  # claimed 1.70 for a crate that has never been able to build below 1.85.
  msrv:
    runs-on: ubuntu-latest
    needs: test
    # MEASURED: 3.5m in CI for `msrv (forma-server)` (run #16). 15 is ~4x.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: forma-ir
            rust: "1.71"
          - crate: forma-server
            rust: "1.85"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          # An MSRV toolchain produces incompatible artifacts; keying by crate
          # AND version stops the two legs evicting each other's cache.
          key: msrv-${{ matrix.crate }}-${{ matrix.rust }}
      # A plain fresh resolve takes the newest semver-compatible version even
      # when it declares a newer Rust: sha2 0.11.1 (2026-10-12) needs 1.88, so
      # this leg failed before compiling any forma-server code. A 1.85 consumer
      # locks with Cargo's MSRV-aware resolver (Cargo 1.84+), which prefers
      # versions that fit the members' declared rust-version; this step locks
      # the graph the same way and the check below builds that lock.
      # Not on forma-ir's leg: Cargo 1.71 predates the setting. The tree line
      # prints the sha2 version this leg built.
      - name: Lock with the MSRV-aware resolver
        if: matrix.crate == 'forma-server'
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: |
          cargo generate-lockfile
          cargo tree -p forma-server -i sha2 --depth 0
      - run: cargo check -p ${{ matrix.crate }} --all-targets

  # deny.toml ships in the repo; running it is what makes it a policy rather
  # than a file. Cheap and independent, so it stays in the first tier.
  deny:
    runs-on: ubuntu-latest
    # The action fetches the RustSec advisory DB over the network; everything
    # else is local. 10 is ~5x a typical 2m run.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # `[patch.crates-io]` silently falls back to the PUBLISHED forma-ir if the
  # local version stops satisfying forma-server's requirement, which would
  # mean CI green-lights a workspace it never actually tested.
  patch-is-live:
    runs-on: ubuntu-latest
    # `cargo tree` resolves the graph without building it. MEASURED: <5s warm
    # locally; cold it is dominated by the registry index fetch.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: patch-is-live
      - name: forma-server must resolve forma-ir from this workspace
        run: |
          cargo tree -p forma-server -i forma-ir | tee /tmp/tree.txt
          grep -q "crates/forma-ir" /tmp/tree.txt \
            || { echo "::error::forma-server is building against the PUBLISHED forma-ir, not this tree"; exit 1; }
