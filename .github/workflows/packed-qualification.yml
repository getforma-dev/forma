name: Packed qualification

# TEMPORARY DIAGNOSTIC BRANCH ONLY. Reuses this registered workflow ID without
# merging diagnostics into main. Original packed runtime: 9195d880; this branch
# supplies explicitly different navigation observations and reviewed ownership.
on:
  workflow_dispatch:
concurrency:
  group: packed-client-diagnostic-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read

env:
  CARGO_BUILD_JOBS: '3'
  VITEST_MAX_WORKERS: '2'
  PLAYWRIGHT_SKIP_BROWSER_GC: '1'
  ORIGINAL_SOURCE: 9195d88088734f36ab32ccb41efd6ba020daf4b9
  OWNER_SOURCE: cdf21c2a3bd00d3877a8ce952bc122c832ab3451

jobs:
  client-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Retain exact diagnostic diff and refuse unrelated changes
        run: |
          mkdir "$RUNNER_TEMP/client-inputs"
          git diff "$ORIGINAL_SOURCE" HEAD > "$RUNNER_TEMP/client-inputs/diagnostic.diff"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {readFileSync} from 'node:fs';
          for(const file of ['scripts/release-owned-linux.py','scripts/release-owned-linux.test.py'])assert.deepEqual(readFileSync(file),execFileSync('git',['show',process.env.OWNER_SOURCE+':'+file]));
          const allowed=new Set(['.github/workflows/packed-qualification.yml','e2e/performance/client/run.mjs','e2e/performance/client/navigation-diagnostic.mjs','e2e/performance/client/navigation-diagnostic.test.mjs','scripts/release-owned-linux.py','scripts/release-owned-linux.test.py']);
          const changed=execFileSync('git',['diff','--name-only',process.env.ORIGINAL_SOURCE,'HEAD'],{encoding:'utf8'}).trim().split('\n');
          for(const file of changed)assert(allowed.has(file),'unreviewed diagnostic scope: '+file);
          console.log({originalProductSource:process.env.ORIGINAL_SOURCE,diagnosticHarness:process.env.GITHUB_SHA,reviewedOwner:process.env.OWNER_SOURCE,changed});
          NODE
      - name: Fetch and authenticate the fixed original artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/getforma-dev/forma/actions/runs/39010572124 > "$RUNNER_TEMP/client-inputs/run.json"
          gh api repos/getforma-dev/forma/actions/artifacts/12092861796 > "$RUNNER_TEMP/client-inputs/artifact.json"
          gh api repos/getforma-dev/forma/actions/artifacts/12092861796/zip > "$RUNNER_TEMP/client-inputs/original.zip"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'client-inputs'
          a=json.loads((p/'artifact.json').read_text());r=json.loads((p/'run.json').read_text());b=(p/'original.zip').read_bytes()
          expected='55709ff78d34d1db18205f084467e8d925f3f0b96014428bf638e4a0bee93d6b'
          assert r['id']==39010572124 and r['run_attempt']==1 and r['head_sha']==os.environ['ORIGINAL_SOURCE']
          assert a['id']==12092861796 and a['name']=='qualification-candidates' and not a['expired']
          assert a['workflow_run']['id']==r['id'] and a['workflow_run']['head_sha']==r['head_sha']
          assert len(b)==a['size_in_bytes']==2852761 and a['digest']=='sha256:'+expected and hashlib.sha256(b).hexdigest()==expected
          print('Original artifact source/run/size/API+producer digest verified')
          PY
          python3 scripts/release-unpack.py zip "$RUNNER_TEMP/client-inputs/original.zip" "$RUNNER_TEMP/client-artifacts" 268435456
      - name: Install the unchanged locked harness dependencies
        run: |
          bash scripts/install-deps.sh
          npm audit signatures
          node --test e2e/performance/client/navigation-diagnostic.test.mjs
      - name: Stage the original packed libraries using the existing P17 lock recipe
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync,appendFileSync,mkdirSync,readdirSync} from 'node:fs';
          import {join} from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {validateCandidate} from './scripts/candidate-scaffold.mjs';
          import {assertReleaseSet} from './scripts/release-set.mjs';
          import {stageFixtureNpm,assertResolvesInside} from './scripts/release-fixture-apps.mjs';
          import {auditCandidateSignatures} from './scripts/audit-release-signatures.mjs';
          import {createPerformanceJournal} from './scripts/release-performance-journal.mjs';
          const tmp=process.env.RUNNER_TEMP,dir=join(tmp,'client-artifacts'),project=join(tmp,'packed-client');
          const set=validateCandidate(dir,'7bcef0e2d6edd04860c59ba10676715458febe9a4dd0b608ece3e170587e0af8',process.env.ORIGINAL_SOURCE);
          assert.equal(set.run,'39010572124');assert.equal(set.dryRun,true);assertReleaseSet(set.packages,'v3.0.0-beta.3');
          assert.deepEqual(readFileSync(join(dir,'Cargo.lock')),readFileSync('Cargo.lock'));
          assert.equal(process.version,set.node);assert.equal(execFileSync('npm',['--version'],{encoding:'utf8'}).trim(),set.npm);
          mkdirSync(project);const install=stageFixtureNpm(set.packages,dir,JSON.parse(readFileSync('package-lock.json')));
          for(const [name,value]of [['package.json',install.manifest],['package-lock.json',install.lock]])writeFileSync(join(project,name),JSON.stringify(value)+'\n',{flag:'wx'});
          const lock=readFileSync(join(project,'package-lock.json'));
          execFileSync('npm',['ci','--ignore-scripts','--no-audit','--no-fund'],{cwd:project,stdio:'inherit'});
          assert.deepEqual(readFileSync(join(project,'package-lock.json')),lock);console.log(assertResolvesInside(project));
          for(const file of ['package.json','package-lock.json'])writeFileSync(join(tmp,'client-inputs','packed-client-'+file),readFileSync(join(project,file)),{flag:'wx'});
          assert.deepEqual(readFileSync('package-lock.json'),execFileSync('git',['show',process.env.ORIGINAL_SOURCE+':package-lock.json']));
          console.log(auditCandidateSignatures(project,set.packages,dir));
          const files=(root,rel='')=>readdirSync(join(root,rel),{withFileTypes:true}).flatMap(e=>{assert(!e.isSymbolicLink());const p=join(rel,e.name);return e.isDirectory()?files(root,p):[p];}).sort();
          for(const name of ['core','compiler','build']){
            const p=set.packages.find(p=>p.name==='@getforma/'+name),original=join(tmp,'original-'+name),installed=join(project,'node_modules/@getforma',name);
            execFileSync('python3',['scripts/release-unpack.py','tar',join(dir,p.file),original,'268435456']);
            const from=join(original,'package','dist'),to=join(installed,'dist');assert.deepEqual(files(from),files(to));
            for(const file of files(from))assert.deepEqual(readFileSync(join(from,file)),readFileSync(join(to,file)));
            assert.equal(JSON.parse(readFileSync(join(installed,'package.json'))).version,p.version);
          }
          const parent=join(tmp,'client-evidence');mkdirSync(parent);
          const journal=createPerformanceJournal(parent,{diagnosticOnly:true,originalProductSource:set.commit,originalRun:set.run,diagnosticHarness:process.env.GITHUB_SHA,reviewedOwner:process.env.OWNER_SOURCE,allBrowserWorkloadUnchanged:true});
          for(const [name,value]of Object.entries({FORMA_BENCH_CORE:join(project,'node_modules/@getforma/core'),FORMA_BENCH_OUTPUT:join(journal,'client-report.json'),FORMA_PERFORMANCE_EVIDENCE:journal,FORMA_CLIENT_NAVIGATION_DIAGNOSTICS:join(parent,'navigation')}))appendFileSync(process.env.GITHUB_ENV,name+'='+value+'\n');
          console.log('Original packed libraries installed and byte-verified; no workspace dist or library rebuild.');
          NODE
      - name: Exercise the actual Linux reaper before and after control
        run: |
          mkdir "$RUNNER_TEMP/client-inputs/owner-before"
          git show 9195d88088734f36ab32ccb41efd6ba020daf4b9:scripts/release-owned-linux.py > "$RUNNER_TEMP/client-inputs/owner-before/release-owned-linux.py"
          git show cdf21c2a3bd00d3877a8ce952bc122c832ab3451:scripts/release-owned-linux.test.py > "$RUNNER_TEMP/client-inputs/owner-before/release-owned-linux.test.py"
          set +e
          timeout 20s python3 "$RUNNER_TEMP/client-inputs/owner-before/release-owned-linux.test.py" Ownership.test_adopted_burst_is_reaped_while_worker_is_alive -v > "$RUNNER_TEMP/client-inputs/owner-before.log" 2>&1
          before_status=$?
          set -e
          test "$before_status" -eq 1
          grep -F 'adopted zombies remained while worker was alive' "$RUNNER_TEMP/client-inputs/owner-before.log"
          timeout 45s python3 scripts/release-owned-linux.test.py -v > "$RUNNER_TEMP/client-inputs/owner-after.log" 2>&1
      - name: Install the original locked three-engine runners
        timeout-minutes: 5
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - name: One ordinary three-engine client comparison with bounded diagnostics
        timeout-minutes: 11
        env:
          DEBUG: pw:browser
        run: python3 scripts/release-owned-linux.py "$RUNNER_TEMP/client-owned" 600 -- node e2e/performance/client/run.mjs --browser all
      - name: Validate the original complete client observations only
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {validateComparison} from './scripts/release-performance-contract.mjs';
          import {readPerformanceJournal} from './scripts/release-performance-journal.mjs';
          validateComparison(JSON.parse(readFileSync(process.env.FORMA_BENCH_OUTPUT)));
          const journal=readPerformanceJournal(process.env.FORMA_PERFORMANCE_EVIDENCE,undefined,{verifyHashes:true});
          console.log('Client-only original three-engine report validated;',journal.entries.length,'retained records. Whole P17 remains separate.');
          NODE
      - name: Retain original inputs, partial observations and cleanup on every outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packed-client-navigation-diagnostic
          path: |
            ${{ runner.temp }}/client-inputs/
            ${{ runner.temp }}/client-evidence/
            ${{ runner.temp }}/client-owned/
          if-no-files-found: error
          retention-days: 30
