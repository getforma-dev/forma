name: FORMA-219 bounded RC4 input diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: forma-219-bounded-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.93.1'
      - name: Install locked diagnostic tools
        run: |
          bash scripts/install-deps.sh
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Download actual original RC4 packed set once
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39334279022 --repo getforma-dev/forma --name qualification-candidates --dir "$RUNNER_TEMP/rc4-packed"
      - name: Three original and three callback-instrumented observations
        run: python3 scripts/release-owned-linux.py "$RUNNER_TEMP/diagnostic-owned" 900 -- node scripts/diagnose-219-input.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: forma-219-input-diagnostic
          path: |
            ${{ runner.temp }}/diagnostic-219-input/
            ${{ runner.temp }}/diagnostic-owned/
          if-no-files-found: error
          retention-days: 30
