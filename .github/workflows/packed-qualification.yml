name: Packed qualification

# Manual, read-only P17 rehearsal. This never creates a tag, publishes packages,
# closes a milestone, or substitutes for exact-main CI and the tagged release.
on:
  workflow_dispatch:
    inputs:
      target_tag:
        description: Intended release tag; all coordinated checked-out versions must match
        required: true
        default: v3.0.0-beta.3
        type: string
concurrency:
  group: packed-qualification-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '3'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
  PLAYWRIGHT_SKIP_BROWSER_GC: '1'
  FORMA_PERFORMANCE_TARGET_TAG: ${{ inputs.target_tag }}

jobs:
  pack:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      record-sha256: ${{ steps.pack.outputs.record-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: '1.93.1'
      # `check` validates coordinated versions, not milestone readiness. An RC
      # with pending gates must be able to collect its dry-run evidence first.
      - name: Check the coordinated source versions against the intended tag
        run: node scripts/release-set.mjs check "$FORMA_PERFORMANCE_TARGET_TAG"
      - run: bash scripts/install-deps.sh
      - run: npm audit signatures
      - run: npm run build
      - name: Pack committed candidates and record ten-file restoration
        id: pack
        run: node scripts/candidate-scaffold.mjs pack "$RUNNER_TEMP/candidate artifacts"
      - name: Retain original candidate archives and restoration record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-candidates
          path: ${{ runner.temp }}/candidate artifacts
          if-no-files-found: error
          retention-days: 30

  verify:
    needs: pack
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Separate checkout: no workspace dist can replace a packed product.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: '1.93.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualification-candidates
          path: ${{ runner.temp }}/candidate artifacts
          digest-mismatch: error
      - name: Authenticate the original DS11 source, versions and Cargo lock
        env:
          RECORD_SHA256: ${{ needs.pack.outputs.record-sha256 }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { validateCandidate } from './scripts/candidate-scaffold.mjs';
          import { assertReleaseSet } from './scripts/release-set.mjs';
          const dir = join(process.env.RUNNER_TEMP, 'candidate artifacts');
          const set = validateCandidate(dir, process.env.RECORD_SHA256, process.env.GITHUB_SHA);
          assert.equal(set.dryRun, true, 'qualification requires original dry-packed candidates');
          assert.equal(set.run, process.env.GITHUB_RUN_ID, 'DS11 must come from this run');
          assertReleaseSet(set.packages, process.env.FORMA_PERFORMANCE_TARGET_TAG);
          assert.deepEqual(readFileSync(join(dir, 'Cargo.lock')), readFileSync('Cargo.lock'), 'packed Cargo lock differs from this checkout');
          NODE
      - run: bash scripts/install-deps.sh
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: bash scripts/check-advisories.sh
      - run: npm audit signatures
      - name: Install the locked three-engine runners
        timeout-minutes: 5
        run: |
          # Keep the same signed Ubuntu suites/packages. The Azure mirror stalled
          # the retained b071500c attempt before any P17 test could execute.
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [[ -f "$apt_source" ]]; then
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      # 44 minutes plus the existing owner's 15-second cleanup fits the 45-minute
      # step. The verifier's separate G6/P17 <= 1800-second gate is unchanged.
      - name: Whole packed P17 under Linux process ownership
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/p17"
          python3 scripts/release-owned-linux.py "$RUNNER_TEMP/p17-owned" 2640 -- node scripts/verify-release-set.mjs "$RUNNER_TEMP/candidate artifacts" "$RUNNER_TEMP/p17/p17.json"
      - name: Retain all original P17 results and owned cleanup, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-qualification-p17
          path: |
            ${{ runner.temp }}/p17/
            ${{ runner.temp }}/p17-owned/
          if-no-files-found: error
          retention-days: 30
