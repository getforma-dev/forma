name: Packed qualification

# TEMPORARY NEVER-MERGE DIAGNOSTIC BRANCH. Original packed product is9efcfc2e;
# this distinct harness observes public return/entry and long-task intervals.
on:
  workflow_dispatch:
concurrency:
  group: packed-decoder-diagnostic-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  CARGO_BUILD_JOBS: '3'
  VITEST_MAX_WORKERS: '2'
  PLAYWRIGHT_SKIP_BROWSER_GC: '1'
  ORIGINAL_SOURCE: 9efcfc2e34c5a40c66339970118601772b63f474

jobs:
  decoder-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Retain exact diagnostic delta and refuse unrelated changes
        run: |
          mkdir "$RUNNER_TEMP/decoder-inputs"
          git diff "$ORIGINAL_SOURCE" HEAD > "$RUNNER_TEMP/decoder-inputs/diagnostic.diff"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const allowed=new Set(['.github/workflows/packed-qualification.yml','scripts/release-performance-decoder.mjs','scripts/decoder-timing-diagnostic.mjs','scripts/decoder-timing-diagnostic.test.mjs','scripts/run-decoder-timing-diagnostic.mjs']);
          const changed=execFileSync('git',['diff','--name-only',process.env.ORIGINAL_SOURCE,'HEAD'],{encoding:'utf8'}).trim().split('\n');
          for(const path of changed)assert(allowed.has(path),'unreviewed diagnostic scope: '+path);
          console.log({diagnosticOnly:true,releaseAcceptance:false,originalProductSource:process.env.ORIGINAL_SOURCE,diagnosticHarness:process.env.GITHUB_SHA,changed});
          NODE
      - name: Fetch the fixed original candidate and authenticate source and archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/getforma-dev/forma/actions/runs/39016966304 > "$RUNNER_TEMP/decoder-inputs/run.json"
          gh api repos/getforma-dev/forma/actions/artifacts/12094879342 > "$RUNNER_TEMP/decoder-inputs/artifact.json"
          gh api repos/getforma-dev/forma/actions/artifacts/12094879342/zip > "$RUNNER_TEMP/decoder-inputs/original.zip"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'decoder-inputs'
          a=json.loads((p/'artifact.json').read_text());r=json.loads((p/'run.json').read_text());b=(p/'original.zip').read_bytes()
          expected='68d9db63d8e223a4df05d6d5f6c20e5b028a035e9e58e6794e6f2da03809b771'
          assert r['id']==39016966304 and r['run_attempt']==1 and r['head_sha']==os.environ['ORIGINAL_SOURCE']
          assert a['id']==12094879342 and a['name']=='qualification-candidates' and not a['expired']
          assert a['workflow_run']['id']==r['id'] and a['workflow_run']['head_sha']==r['head_sha']
          assert len(b)==a['size_in_bytes']==2852769 and a['digest']=='sha256:'+expected and hashlib.sha256(b).hexdigest()==expected
          print('Original source/run/size/API+producer archive digest verified')
          PY
          python3 scripts/release-unpack.py zip "$RUNNER_TEMP/decoder-inputs/original.zip" "$RUNNER_TEMP/decoder-artifacts" 268435456
      - name: Install the unchanged locked harness dependencies and finite controls
        run: |
          bash scripts/install-deps.sh
          npm audit signatures
          node --test --test-concurrency=2 scripts/decoder-timing-diagnostic.test.mjs scripts/release-performance-decoder.test.mjs
      - name: Stage original packed libraries without a rebuild
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync,mkdirSync,readdirSync,existsSync} from 'node:fs';
          import {join} from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {validateCandidate} from './scripts/candidate-scaffold.mjs';
          import {assertReleaseSet} from './scripts/release-set.mjs';
          import {stageFixtureNpm,assertResolvesInside} from './scripts/release-fixture-apps.mjs';
          import {auditCandidateSignatures} from './scripts/audit-release-signatures.mjs';
          const tmp=process.env.RUNNER_TEMP,dir=join(tmp,'decoder-artifacts'),project=join(tmp,'packed-decoder');
          const set=validateCandidate(dir,'e94d1ebdf491b961e6c70b84dc5ef96fa0a8feff3e6b6259386eb2cd98596f21',process.env.ORIGINAL_SOURCE);
          assert.equal(set.run,'39016966304');assert.equal(set.dryRun,true);assertReleaseSet(set.packages,'v3.0.0-beta.3');
          assert.deepEqual(readFileSync(join(dir,'Cargo.lock')),readFileSync('Cargo.lock'));
          assert.deepEqual(readFileSync('package-lock.json'),execFileSync('git',['show',process.env.ORIGINAL_SOURCE+':package-lock.json']));
          assert.equal(process.version,set.node);assert.equal(execFileSync('npm',['--version'],{encoding:'utf8'}).trim(),set.npm);
          for(const name of ['core','compiler','build','create-app'])assert(!existsSync('packages/'+name+'/dist'));
          mkdirSync(project);const install=stageFixtureNpm(set.packages,dir,JSON.parse(readFileSync('package-lock.json')));
          for(const [name,value]of [['package.json',install.manifest],['package-lock.json',install.lock]])writeFileSync(join(project,name),JSON.stringify(value)+'\n',{flag:'wx'});
          const lock=readFileSync(join(project,'package-lock.json'));
          execFileSync('npm',['ci','--ignore-scripts','--no-audit','--no-fund'],{cwd:project,stdio:'inherit'});
          assert.deepEqual(readFileSync(join(project,'package-lock.json')),lock);console.log(assertResolvesInside(project));
          for(const file of ['package.json','package-lock.json'])writeFileSync(join(tmp,'decoder-inputs','packed-decoder-'+file),readFileSync(join(project,file)),{flag:'wx'});
          console.log(auditCandidateSignatures(project,set.packages,dir));
          const files=(root,rel='')=>readdirSync(join(root,rel),{withFileTypes:true}).flatMap(e=>{assert(!e.isSymbolicLink());const p=join(rel,e.name);return e.isDirectory()?files(root,p):[p];}).sort();
          for(const name of ['core','compiler','build']){
            const p=set.packages.find(p=>p.name==='@getforma/'+name),original=join(tmp,'original-'+name),installed=join(project,'node_modules/@getforma',name);
            execFileSync('python3',['scripts/release-unpack.py','tar',join(dir,p.file),original,'268435456']);
            const from=join(original,'package','dist'),to=join(installed,'dist');assert.deepEqual(files(from),files(to));
            for(const file of files(from))assert.deepEqual(readFileSync(join(from,file)),readFileSync(join(to,file)));
          }
          console.log('All seven archives authenticated; actual installed core/compiler/build bytes equal original archives. No product or compiler rebuild.');
          NODE
      - name: Install the locked Chromium runner
        timeout-minutes: 5
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: One diagnostic-only decoder observation with both live controls
        timeout-minutes: 11
        run: python3 scripts/release-owned-linux.py "$RUNNER_TEMP/decoder-owned" 600 -- node scripts/run-decoder-timing-diagnostic.mjs "$RUNNER_TEMP/packed-decoder" "$RUNNER_TEMP/decoder-evidence"
      - name: Retain original inputs, all observations and cleanup on every outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packed-decoder-timing-diagnostic
          path: |
            ${{ runner.temp }}/decoder-inputs/
            ${{ runner.temp }}/decoder-evidence/
            ${{ runner.temp }}/decoder-owned/
          if-no-files-found: error
          retention-days: 30
