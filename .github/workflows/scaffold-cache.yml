name: Scaffold release cache

on:
  pull_request:
    paths:
      - 'packages/create-app/**'
      - 'scripts/scaffold-cache-measure.mjs'
      - '.github/workflows/scaffold-cache.yml'
  workflow_dispatch:

concurrency:
  group: scaffold-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        template: [minimal, dashboard]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Isolate the cache experiment toolchain
        shell: bash
        run: |
          set -euo pipefail
          # rust-cache hashes every installed toolchain. Start both jobs with
          # the same dedicated home, independent of the runner image inventory.
          scaffold_rustup_home="$RUNNER_TEMP/forma-scaffold-rustup"
          if [[ -e "$scaffold_rustup_home" || -L "$scaffold_rustup_home" ]]; then
            echo '::error::Scaffold toolchain home must be fresh'
            exit 1
          fi
          printf 'RUSTUP_HOME=%s\n' "$scaffold_rustup_home" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.93.1'
      - name: Verify the cache experiment toolchain
        shell: bash
        run: |
          set -euo pipefail
          scaffold_toolchain='1.93.1-x86_64-unknown-linux-gnu'
          test "$RUSTUP_HOME" = "$RUNNER_TEMP/forma-scaffold-rustup"
          test -d "$RUSTUP_HOME"
          test ! -L "$RUSTUP_HOME"
          scaffold_inventory="$(rustup toolchain list --quiet)"
          printf 'Installed toolchain: %s\n' "$scaffold_inventory"
          test "$scaffold_inventory" = "$scaffold_toolchain"
          scaffold_bin="$RUSTUP_HOME/toolchains/$scaffold_toolchain/bin"
          scaffold_rustc="$(rustup which rustc)"
          scaffold_cargo="$(rustup which cargo)"
          printf 'Toolchain home: %s\nSelected rustc: %s\nSelected cargo: %s\n' "$RUSTUP_HOME" "$scaffold_rustc" "$scaffold_cargo"
          test "$scaffold_rustc" = "$scaffold_bin/rustc"
          test "$scaffold_cargo" = "$scaffold_bin/cargo"
          scaffold_rustc_info="$(rustc -vV)"
          scaffold_selected_info="$("$scaffold_rustc" -vV)"
          test "$scaffold_rustc_info" = "$scaffold_selected_info"
          test "$(printf '%s\n' "$scaffold_rustc_info" | sed -n 's/^release: //p')" = '1.93.1'
          test "$(printf '%s\n' "$scaffold_rustc_info" | sed -n 's/^host: //p')" = 'x86_64-unknown-linux-gnu'
          scaffold_cargo_info="$(cargo -V)"
          scaffold_selected_cargo="$("$scaffold_cargo" -V)"
          test "$scaffold_cargo_info" = "$scaffold_selected_cargo"
          printf '%s\n%s\n' "$scaffold_rustc_info" "$scaffold_cargo_info"
      - run: npm ci --ignore-scripts
      - run: node scripts/scaffold-cache-measure.mjs prepare ${{ matrix.template }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: rust-cache
        with:
          workspaces: ../cache-${{ matrix.template }} -> target
          # A unique measurement cache: cold cannot restore an earlier run.
          prefix-key: forma-262-${{ github.run_id }}-${{ github.run_attempt }}
          shared-key: ${{ matrix.template }}
          save-if: 'true'
      - name: Measure cold build
        run: node scripts/scaffold-cache-measure.mjs build ${{ matrix.template }} cold
        env:
          FORMA_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scaffold-cache-${{ matrix.template }}-cold
          path: scaffold-cache-${{ matrix.template }}-cold.json
          if-no-files-found: error
          retention-days: 14

  warm:
    needs: cold
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        template: [minimal, dashboard]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Isolate the cache experiment toolchain
        shell: bash
        run: |
          set -euo pipefail
          # rust-cache hashes every installed toolchain. Start both jobs with
          # the same dedicated home, independent of the runner image inventory.
          scaffold_rustup_home="$RUNNER_TEMP/forma-scaffold-rustup"
          if [[ -e "$scaffold_rustup_home" || -L "$scaffold_rustup_home" ]]; then
            echo '::error::Scaffold toolchain home must be fresh'
            exit 1
          fi
          printf 'RUSTUP_HOME=%s\n' "$scaffold_rustup_home" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.93.1'
      - name: Verify the cache experiment toolchain
        shell: bash
        run: |
          set -euo pipefail
          scaffold_toolchain='1.93.1-x86_64-unknown-linux-gnu'
          test "$RUSTUP_HOME" = "$RUNNER_TEMP/forma-scaffold-rustup"
          test -d "$RUSTUP_HOME"
          test ! -L "$RUSTUP_HOME"
          scaffold_inventory="$(rustup toolchain list --quiet)"
          printf 'Installed toolchain: %s\n' "$scaffold_inventory"
          test "$scaffold_inventory" = "$scaffold_toolchain"
          scaffold_bin="$RUSTUP_HOME/toolchains/$scaffold_toolchain/bin"
          scaffold_rustc="$(rustup which rustc)"
          scaffold_cargo="$(rustup which cargo)"
          printf 'Toolchain home: %s\nSelected rustc: %s\nSelected cargo: %s\n' "$RUSTUP_HOME" "$scaffold_rustc" "$scaffold_cargo"
          test "$scaffold_rustc" = "$scaffold_bin/rustc"
          test "$scaffold_cargo" = "$scaffold_bin/cargo"
          scaffold_rustc_info="$(rustc -vV)"
          scaffold_selected_info="$("$scaffold_rustc" -vV)"
          test "$scaffold_rustc_info" = "$scaffold_selected_info"
          test "$(printf '%s\n' "$scaffold_rustc_info" | sed -n 's/^release: //p')" = '1.93.1'
          test "$(printf '%s\n' "$scaffold_rustc_info" | sed -n 's/^host: //p')" = 'x86_64-unknown-linux-gnu'
          scaffold_cargo_info="$(cargo -V)"
          scaffold_selected_cargo="$("$scaffold_cargo" -V)"
          test "$scaffold_cargo_info" = "$scaffold_selected_cargo"
          printf '%s\n%s\n' "$scaffold_rustc_info" "$scaffold_cargo_info"
      - run: npm ci --ignore-scripts
      - run: node scripts/scaffold-cache-measure.mjs prepare ${{ matrix.template }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: rust-cache
        with:
          workspaces: ../cache-${{ matrix.template }} -> target
          # A unique measurement cache: cold cannot restore an earlier run.
          prefix-key: forma-262-${{ github.run_id }}-${{ github.run_attempt }}
          shared-key: ${{ matrix.template }}
          save-if: 'false'
      - name: Measure warm build
        run: node scripts/scaffold-cache-measure.mjs build ${{ matrix.template }} warm
        env:
          FORMA_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scaffold-cache-${{ matrix.template }}-warm
          path: scaffold-cache-${{ matrix.template }}-warm.json
          if-no-files-found: error
          retention-days: 14
