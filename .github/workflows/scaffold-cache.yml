name: Scaffold release cache

on:
  pull_request:
    paths:
      - 'packages/create-app/**'
      - 'scripts/scaffold-cache-measure.mjs'
      - '.github/workflows/scaffold-cache.yml'
  workflow_dispatch:

concurrency:
  group: scaffold-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cold:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        template: [minimal, dashboard]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: '1.93.1'
      - run: npm ci --ignore-scripts
      - run: npm run build -w packages/create-app
      - run: node scripts/scaffold-cache-measure.mjs prepare ${{ matrix.template }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: rust-cache
        with:
          workspaces: ../cache-${{ matrix.template }} -> target
          # A unique measurement cache: cold cannot restore an earlier run.
          prefix-key: forma-262-${{ github.run_id }}-${{ github.run_attempt }}
          shared-key: ${{ matrix.template }}
          save-if: 'true'
      - name: Measure cold build
        run: node scripts/scaffold-cache-measure.mjs build ${{ matrix.template }} cold
        env:
          FORMA_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scaffold-cache-${{ matrix.template }}-cold
          path: scaffold-cache-${{ matrix.template }}-cold.json
          if-no-files-found: error
          retention-days: 14

  warm:
    needs: cold
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        template: [minimal, dashboard]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: '1.93.1'
      - run: npm ci --ignore-scripts
      - run: npm run build -w packages/create-app
      - run: node scripts/scaffold-cache-measure.mjs prepare ${{ matrix.template }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: rust-cache
        with:
          workspaces: ../cache-${{ matrix.template }} -> target
          # A unique measurement cache: cold cannot restore an earlier run.
          prefix-key: forma-262-${{ github.run_id }}-${{ github.run_attempt }}
          shared-key: ${{ matrix.template }}
          save-if: 'false'
      - name: Measure warm build
        run: node scripts/scaffold-cache-measure.mjs build ${{ matrix.template }} warm
        env:
          FORMA_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scaffold-cache-${{ matrix.template }}-warm
          path: scaffold-cache-${{ matrix.template }}-warm.json
          if-no-files-found: error
          retention-days: 14
