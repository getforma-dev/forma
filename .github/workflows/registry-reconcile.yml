name: Weekly registry reconciliation

# FORMA-135 / SR2 / L-48. Read-only detection; no publishing or settings writes.
# L-60 external alert delivery remains deferred. A failed run and its retained
# report are not evidence that an external notification reached the founder.
on:
  schedule:
    - cron: '43 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Compare every covered registry archive with its release record
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/registry-reconcile.mjs --policy scripts/registry-reconcile-policy.json --output "$RUNNER_TEMP/registry-reconcile/report.json"
      - name: Summarize the retained result
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/registry-reconcile/report.json', 'utf8'));
          const status = report.passed === true ? 'PASS' : 'FAIL';
          const count = Array.isArray(report.findings) ? report.findings.length : 'unknown';
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Registry reconciliation: **${status}**; findings: ${count}.\n\n` +
            'See the registry-reconciliation artifact for covered versions and discrepancies.\n\n' +
            'External alert delivery remains deferred under L-60; no delivery is claimed.\n');
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: registry-reconciliation
          path: ${{ runner.temp }}/registry-reconcile/
          if-no-files-found: error
          retention-days: 30
