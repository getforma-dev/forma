name: Compatibility Check

# Weekly: the newest PUBLISHED @getforma/core still exports every symbol the
# compiler generates imports of. Compiled output naming another package's API
# is a dependency, even though nothing in package.json records it. Came from
# forma-tools' .github at the repository merge (FORMA-113): the published core
# is installed in a scratch project, outside the workspace, since the workspace
# links @getforma/core to packages/core.
on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at midnight UTC
  workflow_dispatch:       # Manual trigger

# A scheduled run that overlaps a manual one buys nothing; keep the newest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The job declares its token (FORMA-010): it only reads this repository.
jobs:
  verify-compiler-imports:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Two npm installs and two `node -e` require checks, then the compiler's
    # unit suite (3s). Realistic worst case ~3m; 10 is >3x. This job talks to
    # the npm registry, which is the only thing here that can be slow.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      # Deliberately not from the lockfile: this job exists to check the newest
      # published @getforma/core against what the compiler emits.
      - name: Install the published @getforma/core in a scratch project
        run: |
          mkdir -p "$RUNNER_TEMP/compat"
          cd "$RUNNER_TEMP/compat"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund @getforma/core@latest
          node -p "'core ' + require('@getforma/core/package.json').version"

      - name: Verify compiler-generated imports exist in @getforma/core
        working-directory: ${{ runner.temp }}/compat
        run: |
          node -e "
            const core = require('@getforma/core');
            const required = ['template', 'templateMany', 'createEffect', 'h', 'createSignal', 'Fragment', 'createComputed', 'batch', 'mount'];
            const missing = required.filter(sym => typeof core[sym] === 'undefined');
            if (missing.length > 0) {
              console.error('MISSING from @getforma/core:', missing.join(', '));
              process.exit(1);
            }
            console.log('All', required.length, 'compiler-generated imports verified in @getforma/core');
          "

      - name: Run compiler tests
        run: npm test -w packages/compiler
