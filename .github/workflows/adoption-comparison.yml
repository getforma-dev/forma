name: FORMA-259 fixed adoption comparison

on:
  pull_request:
    types: [opened]
    paths:
      - 'benchmarks/adoption-comparison/**'
      - '.github/workflows/adoption-comparison.yml'

permissions:
  contents: read
concurrency:
  group: adoption-comparison-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  compare:
    if: github.head_ref == 'codex/forma-259-island-comparison' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      # The runner context is unavailable in job-level env, so set the owned path here.
      - name: Own the Playwright download path
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/forma-adoption-playwright" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked harness tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify non-timing refusal and summary controls
        run: node --test benchmarks/adoption-comparison/protocol.test.mjs
      - name: Install the locked Playwright headless shell
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium --only-shell
      - name: Build exact public sources and run the fixed ABBA sequence
        run: node benchmarks/adoption-comparison/run.mjs --output "$GITHUB_WORKSPACE/adoption-comparison-results"
      - name: Finish only this campaign's cleanup
        if: always()
        run: |
          if [[ -f adoption-comparison-results/ownership.json ]]; then
            node benchmarks/adoption-comparison/run.mjs --cleanup "$GITHUB_WORKSPACE/adoption-comparison-results"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: forma-259-adoption-${{ github.run_id }}-${{ github.run_attempt }}
          path: adoption-comparison-results/
          if-no-files-found: error
          retention-days: 30
