[package]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
edition = "2021"
# forma-server 0.2.0's floor. Cargo.lock is resolved MSRV-aware against it, so the
# locked crates build on this Rust too.
rust-version = "1.85"

[dependencies]
forma-ir = "0.2"
forma-server = "0.2"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rust-embed = "8"
tracing = "0.1"
tracing-subscriber = "0.3"
