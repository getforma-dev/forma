name: Update @getforma/core dependency

on:
  repository_dispatch:
    types: [core-release]

# Two core releases in quick succession should leave one open PR for the newer
# version, not two racing branches. Keyed on the event type rather than the ref
# because every dispatch arrives on the default branch.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update:
    # Read-only on purpose (FORMA-010): with this token the job cannot push its
    # branch or open its pull request, so the workflow stays inert until DR-32
    # deletes the dispatch at the repository merge. A write token on a workflow
    # that has never run would only widen what a hostile payload could do.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # A checkout, a sed over two template package.json files and one PR API call.
    # Seconds of work; 10 bounds a slow GitHub API without hiding a stall.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The payload is whatever the dispatching token sent. It reaches the shell
      # only as an environment variable, never pasted into the script as an
      # expression, and nothing uses it unless it is a release version: v1.2.3
      # or v1.2.3-rc.1, the "v" optional (TH15, SR21; FORMA-010).
      - name: Extract version from dispatch
        id: version
        env:
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        run: |
          release='^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$PAYLOAD_VERSION" =~ $release ]]; then
            echo "::error::client_payload.version is not a release version (v1.2.3 or v1.2.3-rc.1); nothing was changed."
            exit 1
          fi
          # Strip leading "v" from tag name (v1.0.0 → 1.0.0)
          VERSION="${PAYLOAD_VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Updating @getforma/core to ^$VERSION"

      - name: Update template dependencies
        env:
          VERSION: "^${{ steps.version.outputs.version }}"
        run: |
          # Update all template package.json files
          find templates -name "package.json" -exec \
            sed -i 's|"@getforma/core": "[^"]*"|"@getforma/core": "'"$VERSION"'"|g' {} +
          echo "Updated to $VERSION:"
          grep -r "@getforma/core" templates/ --include="package.json"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update @getforma/core to ^${{ steps.version.outputs.version }}"
          title: "chore: update @getforma/core to ^${{ steps.version.outputs.version }}"
          body: |
            Automated dependency update triggered by [@getforma/core ${{ steps.version.outputs.version }}](https://www.npmjs.com/package/@getforma/core/v/${{ steps.version.outputs.version }}) release.

            Updates `@getforma/core` in all template `package.json` files.

            `tests/templates.test.ts` asserts the exact pinned range, so this PR
            will fail CI until that expectation is updated too — deliberately,
            because the pin exists to guarantee a specific fix is present.

            `@getforma/build` and `@getforma/compiler` are pinned independently
            (a caret range on a 0.x version does not cross minor bumps) and are
            not touched here.
          branch: update-core-${{ steps.version.outputs.version }}
          base: main
